# Run from this checkout: docker compose up -d.
# Build only when the local image is missing; use --build to update explicitly.

services:
  xboard-node:
    build:
      context: .
      dockerfile: Dockerfile
      no_cache: true
      args:
        SOURCE_REPO: ${SOURCE_REPO:-https://github.com/leef627/xboard-node.git}
        SOURCE_REF: ${SOURCE_REF:-dev}
    image: xboard-node:local
    pull_policy: never
    container_name: xboard-node
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config:/etc/xboard-node
    command: ["-c", "/etc/xboard-node/config.yml"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Optional: override panel settings without editing config.yml (still need a valid config file to load).
    # environment:
    #   API_HOST: https://panel.example.com
    #   API_KEY: your-server-token
    #   NODE_ID: "1"
    #   KERNEL_TYPE: singbox
